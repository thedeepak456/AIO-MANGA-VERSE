<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Library — AIO MangaVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-nav"></div>

<header style="background:var(--ink);color:var(--paper);border-bottom:4px solid var(--accent);padding:40px 0;">
  <div class="container">
    <span class="eyebrow">Your shelf</span>
    <h1 style="font-size:clamp(2rem,4vw,3.2rem);">My Library</h1>
    <p style="color:var(--paper-dim);max-width:60ch;">Everything you've bookmarked, synced to your account.</p>
    <div class="data-actions">
      <button class="btn btn--sm btn--ghost" style="border-color:var(--paper);color:var(--paper)" id="exportBtn" type="button">Export my data</button>
      <button class="btn btn--sm btn--ghost" style="border-color:var(--paper);color:var(--paper)" id="importBtn" type="button">Import backup</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>
</header>

<main class="container section" id="libraryRoot">
  <!-- filled by JS -->
</main>

<section class="container section" style="padding-top:0;" id="externalSection" hidden>
  <div class="section__head">
    <div><span class="eyebrow">From Discover</span><h2 style="font-size:1.6rem;">Titles you're tracking</h2></div>
  </div>
  <div id="externalList" style="display:flex;flex-direction:column;gap:10px;"></div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    await MV.ready;
    const root = document.getElementById("libraryRoot");
    const groups = ["Reading", "Plan to Read", "Completed", "Dropped"];

    if (!MV.getSession()) {
      root.innerHTML = `
        <div class="empty-state">
          <h3>Log in to see your library</h3>
          <p>Your library, ratings, and progress are tied to your account now, not just this browser.</p>
          <a class="btn btn--accent" href="login.html">Login / Sign up</a>
        </div>`;
      document.getElementById("exportBtn").disabled = true;
      document.getElementById("importBtn").disabled = true;
      return;
    }

    function render() {
      const lib = MV.getLibrary();
      const slugs = Object.keys(lib);

      if (!slugs.length) {
        root.innerHTML = `
          <div class="empty-state">
            <h3>Your library is empty</h3>
            <p>Tap the <strong>+</strong> on any cover, or "Add to My Library" on a title page, to start tracking what you're reading.</p>
            <a class="btn btn--accent" href="browse.html">Browse the catalog</a>
          </div>`;
        return;
      }

      const titles = slugs.map((s) => MV.findBySlug(s)).filter(Boolean);

      root.innerHTML = groups.map((status) => {
        const inGroup = titles.filter((t) => (lib[t.slug].status || "Plan to Read") === status);
        if (!inGroup.length) return "";
        return `
          <div class="section" style="padding-top:0;">
            <div class="section__head">
              <div><span class="eyebrow">${status}</span><h2 style="font-size:1.6rem;">${status} <span class="pill-count">(${inGroup.length})</span></h2></div>
            </div>
            <div class="panel-grid">${inGroup.map((a) => MV.cardHTML(a)).join("")}</div>
          </div>`;
      }).join("") || `<div class="empty-state"><h3>Nothing here yet</h3><p>Set a status on a title page to sort it into a shelf.</p></div>`;

      MV.bindBookmarkButtons(root);
      // re-render whole library on bookmark removal so it disappears from its shelf
      root.querySelectorAll(".card__bookmark").forEach((btn) => {
        btn.addEventListener("click", () => setTimeout(render, 300));
      });
    }

    render();

    // export / import
    document.getElementById("exportBtn").addEventListener("click", async () => {
      const json = await MV.exportData();
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mangaverse-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
      MV.toast("Backup downloaded");
    });
    document.getElementById("importBtn").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });
    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const result = await MV.importData(reader.result);
        if (result.ok) {
          MV.toast("Backup restored");
          setTimeout(() => location.reload(), 500);
        } else {
          MV.toast(result.error || "Import failed");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    // titles tracked from Discover (external, no local detail page)
    function renderExternal() {
      const ext = MV.getExternal();
      const ids = Object.keys(ext);
      const section = document.getElementById("externalSection");
      const mount = document.getElementById("externalList");
      if (!ids.length) { section.hidden = true; return; }
      section.hidden = false;
      mount.innerHTML = ids.map((id) => {
        const item = ext[id];
        return `
          <div class="discover-card">
            <img src="${item.image || ''}" alt="" onerror="this.style.display='none'">
            <div>
              <h3 style="margin-bottom:2px;">${item.title}</h3>
              <p>Tracked from Discover &middot; ${new Date(item.addedAt).toLocaleDateString()}</p>
            </div>
            <div class="discover-card__actions">
              <a class="btn btn--sm btn--ghost" href="${item.url}" target="_blank" rel="noopener">View on MAL</a>
              <button class="btn btn--sm btn--ghost" type="button" data-remove="${id}">Remove</button>
            </div>
          </div>`;
      }).join("");
      mount.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await MV.toggleExternal(btn.dataset.remove, {});
          MV.toast("Removed from tracking");
          renderExternal();
        });
      });
    }
    renderExternal();
  });
</script>
</body>
</html>
